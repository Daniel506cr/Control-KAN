<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de marcas K · A · N</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#1C2333; --muted:#667085; --line:#E3E8EF;
  --k:#5B5BD6; --k-soft:#EEEEFC;
  --a:#D6409F; --a-soft:#FCEBF5;
  --n:#12A594; --n-soft:#E1F6F3;
  --track:#E6EAF0;
  --late:#E5484D; --late-soft:#FDECEC;
  --lunch:#E2730F; --lunch-soft:#FDF0E2;
  --shadow:0 1px 2px rgba(28,35,51,.04), 0 8px 24px -8px rgba(28,35,51,.10);
  --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F131A; --surface:#181D27; --surface-2:#1F2531; --ink:#ECEFF5; --muted:#98A2B3; --line:#2A3140;
    --k:#9B9EF5; --k-soft:#262848; --a:#F17CC4; --a-soft:#3A2033; --n:#3DD6C2; --n-soft:#163330;
    --track:#2A3140; --late:#FF7378; --late-soft:#3A1E21; --lunch:#FFA057; --lunch-soft:#3A2817;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#181D27; --surface-2:#1F2531; --ink:#ECEFF5; --muted:#98A2B3; --line:#2A3140;
  --k:#9B9EF5; --k-soft:#262848; --a:#F17CC4; --a-soft:#3A2033; --n:#3DD6C2; --n-soft:#163330;
  --track:#2A3140; --late:#FF7378; --late-soft:#3A1E21; --lunch:#FFA057; --lunch-soft:#3A2817;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
main{max-width:1120px;margin:0 auto;padding:32px clamp(12px,3vw,24px) 56px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:28px}
h1{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.15}
.sub{color:var(--muted);margin:4px 0 0;font-size:.95rem}
.clock{text-align:right}
.clock .t{font-variant-numeric:tabular-nums;font-size:clamp(1.4rem,3vw,1.9rem);font-weight:700;letter-spacing:-.02em;line-height:1}
.clock .d{color:var(--muted);font-size:.9rem;margin-top:4px}

/* Tres tarjetas siempre en fila horizontal */
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,2vw,20px)}
.card{
  --c:var(--k); --c-soft:var(--k-soft);
  background:var(--surface);border-radius:24px;box-shadow:var(--shadow);
  padding:clamp(12px,2.4vw,24px);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,1.8vw,18px);
  border:1.5px solid transparent;transition:border-color .2s ease;min-width:0;
}
.card[data-l="A"]{--c:var(--a);--c-soft:var(--a-soft)}
.card[data-l="N"]{--c:var(--n);--c-soft:var(--n-soft)}
.card.late{border-color:var(--late)}
.card.onlunch{border-color:var(--lunch)}

.key{
  position:relative;appearance:none;border:0;padding:0;background:none;cursor:pointer;
  width:min(100%,176px);aspect-ratio:1;border-radius:50%;color:var(--c);font-family:inherit;
  transition:transform .14s var(--ease-out);
}
.key:active{transform:scale(.96)}
.key:disabled{cursor:not-allowed;opacity:.45}
.key:disabled:active{transform:none}
.key svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.key .seg{fill:none;stroke:var(--track);stroke-width:5;stroke-linecap:round;transition:stroke .25s var(--ease-out)}
.key .seg.on{stroke:var(--c)}
.key .disc{
  position:absolute;inset:14%;border-radius:50%;background:var(--c-soft);
  display:grid;place-items:center;font-weight:800;font-size:clamp(2.2rem,7vw,4.2rem);letter-spacing:-.04em;line-height:1;
  transition:background-color .2s ease;
}
@media (hover:hover){.key:not(:disabled):hover .disc{background:color-mix(in srgb,var(--c) 18%,var(--surface))}}
.key:focus-visible{outline:3px solid var(--c);outline-offset:4px}

.time{text-align:center;min-width:0;width:100%}
.timer{font-variant-numeric:tabular-nums;font-size:clamp(1.15rem,3.6vw,2.2rem);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.status{display:inline-block;margin-top:6px;font-size:clamp(.72rem,1.6vw,.85rem);font-weight:600;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:999px;max-width:100%}
.late .status{color:var(--late);background:var(--late-soft)}
.onlunch .status{color:var(--lunch);background:var(--lunch-soft)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.stat{background:var(--surface-2);border-radius:14px;padding:8px 10px;text-align:center;min-width:0}
.stat b{display:block;font-size:clamp(1rem,2.6vw,1.3rem);font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.2}
.stat span{font-size:clamp(.68rem,1.4vw,.78rem);color:var(--muted);font-weight:500}

/* Botones en fila horizontal */
.actions{display:flex;gap:8px;width:100%}
.btn{
  appearance:none;font-family:inherit;cursor:pointer;border:0;border-radius:14px;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:clamp(.75rem,1.6vw,.92rem);
  transition:transform .14s var(--ease-out), background-color .2s ease, color .2s ease;
}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.btn svg{width:18px;height:18px;flex:none}
.btn.lunch{flex:1;background:var(--lunch-soft);color:var(--lunch);padding:0 10px;min-width:0}
.btn.lunch.active{background:var(--lunch);color:#fff}
.btn.reset{width:44px;flex:none;background:var(--surface-2);color:var(--muted)}
.btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){ .btn.lunch .lbl{display:none} .btn.reset{width:40px} }

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:14px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow);transition:opacity .2s var(--ease-out),transform .25s var(--ease-out);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

section.log{margin-top:44px}
.logtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h2{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;margin:0}
.sync{font-size:.85rem;color:var(--muted)}
.ghost{appearance:none;border:0;background:none;color:var(--muted);font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;padding:8px 10px;border-radius:10px}
.ghost:hover{background:var(--surface);color:var(--late)}
.day{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.day h3{margin:0;padding:14px 20px;font-size:.98rem;font-weight:700}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 20px;white-space:nowrap}
thead th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--surface-2)}
tbody tr+tr td{border-top:1px solid var(--line)}
.tag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;font-weight:800}
.tag.K{background:var(--k-soft);color:var(--k)} .tag.A{background:var(--a-soft);color:var(--a)} .tag.N{background:var(--n-soft);color:var(--n)}
.empty{color:var(--muted);padding:22px;background:var(--surface);border-radius:20px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.role{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.role.admin{color:var(--k);background:var(--k-soft);box-shadow:none}
.banner{background:var(--surface);border-radius:16px;padding:12px 16px;margin-bottom:18px;color:var(--muted);font-size:.92rem;box-shadow:var(--shadow)}
.banner[hidden]{display:none}
body:not(.is-admin) .admin-only{display:none!important}
.day h3{display:flex;justify-content:space-between;align-items:center;gap:12px}
.day h3 .ghost{font-size:.8rem}

.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.who .role{margin-top:0}
.signin{appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:.85rem;padding:8px 14px;border-radius:999px;background:var(--ink);color:var(--surface);min-height:36px}
.signin.out{background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.email{font-size:.82rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Control de marcas</h1>
      <p class="sub">Marca cada hora. Cada 10 marcas el contador se reinicia.</p>
      <div class="who">
        <span class="role" id="role">Conectando…</span>
        <span class="email" id="email"></span>
        <button class="signin" id="signin" hidden>Iniciar sesión con Google</button>
        <button class="signin out" id="signout" hidden>Cerrar sesión</button>
      </div>
    </div>
    <div class="clock"><div class="t" id="clockT"></div><div class="d" id="clockD"></div></div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <div class="row3" id="grid"></div>

  <section class="log">
    <div class="logtop">
      <div>
        <h2>Registro por día</h2>
        <div class="sync" id="sync"></div>
      </div>
      <button class="ghost admin-only" id="clearAll">Borrar todo el registro</button>
    </div>
    <div id="log"></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
/* =========================================================
   CONFIGURACIÓN: pega aquí los datos de tu proyecto Firebase
   y los correos de los administradores.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCsMzO0s4QuNcYEtjrks-k5R-GAlGsm78M",
  authDomain: "control-kan-c516c.firebaseapp.com",
  projectId: "control-kan-c516c",
  appId: "1:172509752852:web:8d0d82122a9ed5ed768101"
};
const ADMIN_EMAILS = ["proyectocr3d@gmail.com"];
/* ========================================================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const LETTERS = ['K','A','N'];
const GOAL = 10;
const HOUR = 3600000;

let mode = 'loading';        // loading | shared | offline | unconfigured
let user = null, isAdmin = false;
let events = [];
let control = {resets:{}, clearedBefore:0, hiddenDays:[]};
let derived = {people:{}, hist:{}};
let db = null, auth = null, unsubEvents = null, subscribedCb = null;

/* utilidades */
const pad = n => String(n).padStart(2,'0');
const dayKey = ts => { const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const hm = ts => { const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const hms = ts => { const d=new Date(ts); return hm(ts)+':'+pad(d.getSeconds()); };
const dur = ms => { const s=Math.max(0,Math.floor(ms/1000)); return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60); };
const mins = ms => Math.round(ms/60000);
function longDate(k){
  const [y,m,d] = k.split('-').map(Number);
  const s = new Date(y,m-1,d).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
let toastT;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3200);
}
const normControl = c => ({resets:{...(c?.resets||{})}, clearedBefore:c?.clearedBefore||0, hiddenDays:[...(c?.hiddenDays||[])]});

/* cálculo a partir de los eventos */
function derive(){
  const cb = control.clearedBefore || 0;
  const hidden = new Set(control.hiddenDays || []);
  const evs = events.filter(e => e.ts > cb && !hidden.has(dayKey(e.ts)));
  for(const L of LETTERS){ const r = control.resets?.[L]; if(r && r > cb) evs.push({l:L,t:'r',ts:r}); }
  evs.sort((a,b)=> a.ts-b.ts || (a.t==='r' ? -1 : b.t==='r' ? 1 : 0));
  const people = {}; LETTERS.forEach(L => people[L] = {count:0,last:null,lunchStart:null});
  const hist = {};
  const rec = (ts,L) => { const k=dayKey(ts); hist[k] ??= {}; return hist[k][L] ??= {first:null,last:null,marks:0,cycles:0,lunches:[]}; };
  for(const e of evs){
    const p = people[e.l]; if(!p) continue;
    if(e.t === 'r'){ p.count = 0; p.last = null; }
    else if(e.t === 'm'){
      const r = rec(e.ts,e.l);
      if(!r.first) r.first = e.ts;
      r.last = e.ts; r.marks++; p.count++;
      if(p.count >= GOAL){ p.count = 0; p.last = null; r.cycles++; } else p.last = e.ts;
    }
    else if(e.t === 'ls'){ if(!p.lunchStart) p.lunchStart = e.ts; }
    else if(e.t === 'le'){ if(p.lunchStart){ rec(p.lunchStart,e.l).lunches.push({start:p.lunchStart,end:e.ts}); p.lunchStart = null; } }
  }
  derived = {people, hist};
}
function update(){ derive(); render(); }

/* acciones */
function ready(){
  if(mode !== 'shared'){ toast('El tablero aún no está conectado.'); return false; }
  if(!user){ toast('Inicia sesión con Google para marcar.'); return false; }
  return true;
}
async function addEvent(t,L){
  const ev = {l:L, t, ts:Date.now(), by:user.uid, email:user.email || ''};
  try{ await addDoc(collection(db,'eventos'), ev); }
  catch(e){ toast('No se pudo guardar la marca. Revisa tu conexión o tus permisos.'); }
  return ev;
}
function mark(L){
  if(!ready()) return;
  if(derived.people[L].lunchStart) return;
  const before = derived.people[L].count;
  addEvent('m',L);
  const now = before + 1;
  if(now >= GOAL) toast(`${L} completó ${GOAL} marcas. El contador quedó en pausa en 00:00.`);
  else toast(`${L}: marca ${now} de ${GOAL} a las ${hm(Date.now())}`);
}
function toggleLunch(L){
  if(!ready()) return;
  const start = derived.people[L].lunchStart;
  addEvent(start ? 'le' : 'ls', L);
  if(start) toast(`${L} regresó del almuerzo: ${mins(Date.now()-start)} min`);
  else toast(`${L} salió a almorzar a las ${hm(Date.now())}`);
}
async function saveControl(next){
  try{ await setDoc(doc(db,'control','estado'), next); }
  catch(e){ toast('Solo un administrador puede borrar o reiniciar.'); }
}
function resetCounter(L){
  if(!isAdmin) return;
  if(!confirm(`¿Reiniciar el contador de ${L} a 0 y dejarlo en 00:00? El registro del día se conserva.`)) return;
  const c = normControl(control); c.resets[L] = Date.now(); saveControl(c);
}
function deleteDay(k){
  if(!isAdmin) return;
  if(!confirm(`¿Borrar el registro del ${longDate(k).toLowerCase()}?`)) return;
  const c = normControl(control);
  if(!c.hiddenDays.includes(k)) c.hiddenDays.push(k);
  saveControl(c);
}
document.getElementById('clearAll').addEventListener('click',()=>{
  if(!isAdmin) return;
  if(!confirm('¿Borrar todo el registro y reiniciar los tres contadores? Esto no se puede deshacer.')) return;
  saveControl({resets:{}, clearedBefore:Date.now(), hiddenDays:[]});
});

/* conexión */
function setRole(){
  document.body.classList.toggle('is-admin', isAdmin);
  const role = document.getElementById('role'), banner = document.getElementById('banner');
  const sync = document.getElementById('sync');
  role.classList.toggle('admin', isAdmin);
  document.getElementById('signin').hidden = !(mode === 'shared' && !user);
  document.getElementById('signout').hidden = !(mode === 'shared' && user);
  document.getElementById('email').textContent = user?.email || '';
  if(mode === 'loading') role.textContent = 'Conectando…';
  else if(mode !== 'shared') role.textContent = 'Sin conexión';
  else if(isAdmin) role.textContent = 'Administrador';
  else if(user) role.textContent = 'Puedes marcar';
  else role.textContent = 'Solo lectura';
  sync.textContent = mode === 'shared' ? 'Tablero compartido · se actualiza en vivo para todos' : '';
  if(mode === 'unconfigured'){
    banner.hidden = false;
    banner.textContent = 'Falta configurar Firebase: abre index.html y pega los datos de tu proyecto en la sección CONFIGURACIÓN.';
  } else if(mode === 'offline'){
    banner.hidden = false;
    banner.textContent = 'No se pudo conectar con la base de datos. Revisa tu conexión y la configuración de Firebase.';
  } else if(mode === 'shared' && !user){
    banner.hidden = false;
    banner.textContent = 'Puedes ver el tablero. Para marcar, inicia sesión con Google.';
  } else banner.hidden = true;
}
function subscribeEvents(){
  const cb = control.clearedBefore || 0;
  if(unsubEvents && subscribedCb === cb) return;
  if(unsubEvents) unsubEvents();
  subscribedCb = cb;
  unsubEvents = onSnapshot(query(collection(db,'eventos'), where('ts','>',cb)), qs => {
    events = qs.docs.map(d => d.data());
    if(mode !== 'shared'){ mode = 'shared'; setRole(); }
    update();
  }, () => { mode = 'offline'; setRole(); update(); });
}

if(firebaseConfig.apiKey.startsWith('PEGA')){
  mode = 'unconfigured';
} else {
  try{
    const app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getFirestore(app);
    onAuthStateChanged(auth, u => {
      user = u;
      isAdmin = !!(u?.email && ADMIN_EMAILS.map(e=>e.toLowerCase()).includes(u.email.toLowerCase()));
      setRole(); update();
    });
    onSnapshot(doc(db,'control','estado'), s => {
      control = s.exists() ? normControl(s.data()) : {resets:{}, clearedBefore:0, hiddenDays:[]};
      subscribeEvents();
      update();
    }, () => { mode = 'offline'; setRole(); update(); });
    setTimeout(()=>{ if(mode === 'loading'){ mode = 'offline'; setRole(); update(); } }, 12000);
  }catch(e){ mode = 'offline'; }
}
document.getElementById('signin').addEventListener('click', async () => {
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ toast('No se pudo iniciar sesión. Revisa que este dominio esté autorizado en Firebase.'); }
});
document.getElementById('signout').addEventListener('click', () => signOut(auth));

/* interfaz */
const ICON_LUNCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_RESET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>';
function ringSVG(){
  let s = '<svg viewBox="0 0 100 100" aria-hidden="true">';
  for(let i=0;i<GOAL;i++) s += `<circle class="seg" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="7.2 92.8" transform="rotate(${-90 + i*36 + 3.6} 50 50)"/>`;
  return s + '</svg>';
}
const grid = document.getElementById('grid');
const cards = {};
for(const L of LETTERS){
  const c = document.createElement('article');
  c.className = 'card'; c.dataset.l = L;
  c.innerHTML = `
    <button class="key" aria-label="Marcar ${L}">${ringSVG()}<span class="disc">${L}</span></button>
    <div class="time"><div class="timer">00:00:00</div><span class="status"></span></div>
    <div class="stats">
      <div class="stat"><b class="cnt"></b><span>Marcas</span></div>
      <div class="stat"><b class="cyc"></b><span>Ciclos hoy</span></div>
    </div>
    <div class="actions">
      <button class="btn lunch"></button>
      <button class="btn reset admin-only" aria-label="Reiniciar contador de ${L}" title="Reiniciar contador">${ICON_RESET}</button>
    </div>`;
  c.querySelector('.key').addEventListener('click',()=>mark(L));
  c.querySelector('.lunch').addEventListener('click',()=>toggleLunch(L));
  c.querySelector('.reset').addEventListener('click',()=>resetCounter(L));
  grid.appendChild(c);
  cards[L] = { el:c, key:c.querySelector('.key'), timer:c.querySelector('.timer'), status:c.querySelector('.status'),
    segs:[...c.querySelectorAll('.seg')], cnt:c.querySelector('.cnt'), cyc:c.querySelector('.cyc'), lunch:c.querySelector('.lunch') };
}
function tick(){
  const now = Date.now();
  document.getElementById('clockT').textContent = hms(now);
  const d = new Date(now).toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('clockD').textContent = d.charAt(0).toUpperCase()+d.slice(1);
  for(const L of LETTERS){
    const p = derived.people[L] || {count:0,last:null,lunchStart:null}, v = cards[L];
    if(p.lunchStart){
      v.timer.textContent = dur(now - p.lunchStart);
      v.status.textContent = 'Almuerzo desde '+hm(p.lunchStart);
      v.el.classList.add('onlunch'); v.el.classList.remove('late');
      continue;
    }
    v.el.classList.remove('onlunch');
    const el = p.last ? now - p.last : 0;
    v.timer.textContent = dur(el);
    const late = p.last && el >= HOUR;
    v.el.classList.toggle('late', !!late);
    if(mode === 'loading') v.status.textContent = 'Cargando…';
    else if(!p.last) v.status.textContent = 'En pausa';
    else if(late) v.status.textContent = 'Toca marcar';
    else v.status.textContent = 'Última: '+hm(p.last);
  }
}
function render(){
  const today = dayKey(Date.now());
  const locked = mode !== 'shared' || !user;
  for(const L of LETTERS){
    const p = derived.people[L] || {count:0,last:null,lunchStart:null}, v = cards[L];
    v.segs.forEach((s,i)=>s.classList.toggle('on', i < p.count));
    v.cnt.textContent = p.count+'/'+GOAL;
    v.cyc.textContent = derived.hist[today]?.[L]?.cycles || 0;
    v.key.disabled = !!p.lunchStart || locked;
    v.lunch.disabled = locked;
    v.key.title = p.lunchStart ? 'Termina el almuerzo para volver a marcar' : '';
    v.lunch.innerHTML = p.lunchStart ? `${ICON_BACK}<span class="lbl">Regresé</span>` : `${ICON_LUNCH}<span class="lbl">Almuerzo</span>`;
    v.lunch.setAttribute('aria-label', p.lunchStart ? `${L}: regresé del almuerzo` : `${L}: salir a almorzar`);
    v.lunch.classList.toggle('active', !!p.lunchStart);
    v.lunch.setAttribute('aria-pressed', p.lunchStart ? 'true':'false');
  }
  renderLog();
  tick();
}
function lunchText(L, rec, k){
  const parts = (rec?.lunches||[]).map(x => `${hm(x.start)}–${hm(x.end)} (${mins(x.end-x.start)} min)`);
  const p = derived.people[L];
  if(p?.lunchStart && dayKey(p.lunchStart) === k) parts.push(`desde ${hm(p.lunchStart)} (en curso)`);
  return parts.length ? parts.join(', ') : '—';
}
function renderLog(){
  const log = document.getElementById('log');
  const days = new Set(Object.keys(derived.hist));
  for(const L of LETTERS){ const ls = derived.people[L]?.lunchStart; if(ls) days.add(dayKey(ls)); }
  const list = [...days].sort().reverse();
  if(!list.length){ log.innerHTML = '<div class="empty">Aún no hay marcas. Presiona K, A o N para registrar la primera del día.</div>'; return; }
  log.innerHTML = list.map(k => {
    const rows = LETTERS.map(L => {
      const r = derived.hist[k]?.[L]; const ls = derived.people[L]?.lunchStart;
      if(!r && !(ls && dayKey(ls)===k)) return '';
      return `<tr><td><span class="tag ${L}">${L}</span></td><td>${r?.first ? hms(r.first) : '—'}</td><td>${r?.last ? hms(r.last) : '—'}</td><td>${r?.marks || 0}</td><td>${r?.cycles || 0}</td><td>${lunchText(L, r, k)}</td></tr>`;
    }).join('');
    return `<div class="day"><h3><span>${longDate(k)}</span><button class="ghost admin-only" data-day="${k}">Borrar día</button></h3><div class="scroll"><table>
      <thead><tr><th>Letra</th><th>Primera marca</th><th>Última marca</th><th>Marcas</th><th>Ciclos de ${GOAL}</th><th>Almuerzo</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
  }).join('');
}
document.getElementById('log').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if(b) deleteDay(b.dataset.day); });

setRole(); update();
setInterval(tick, 1000);
let lastDay = dayKey(Date.now());
setInterval(()=>{ const d = dayKey(Date.now()); if(d !== lastDay){ lastDay = d; update(); } }, 30000);
</script>
</body>
</html>
